services:
  db:
    image: mysql:8.0
    container_name: lbvd-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ucstgo
      MYSQL_DATABASE: lbvd
      MYSQL_USER: lbvd_app
      MYSQL_PASSWORD: ucstgo
      LANG: C.UTF-8
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - lbvd_local_db_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lbvd-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lbvd_local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lbvd-local-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://lbvd_app:${MYSQL_PASSWORD}@db:3306/lbvd?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      APP_NAME: LBVD Dashboard
      APP_VERSION: 1.0.0
      DEBUG: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_HTTPS_ONLY: "false"
    expose:
      - "5000"
  nginx:
    image: nginx:alpine
    container_name: lbvd-local-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  lbvd_local_db_data:
  lbvd_local_redis_data:
