version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # dedicated server အတွက် MYSQL_MEMORY_LIMIT ရဲ့ ၅၀-၆၀% ခန့်ကို innodb_buffer_pool_size အဖြစ် သတ်မှတ်ရန်
    command: >
      --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-16g}
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lbvd
      MYSQL_USER: lbvd_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LANG: C.UTF-8
    # ports များကို ဖယ်ထုတ်ထားပါသည် (Host စက်ထဲကပါ လှမ်းခေါ်ခွင့်မပြုဘဲ Docker network ထဲမှာပဲ သီးသန့်ထားရန်)
    volumes:
      - lbvd_prod_db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '${MYSQL_CPU_LIMIT:-12}'
          memory: ${MYSQL_MEMORY_LIMIT:-24g}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_MEMORY_LIMIT:-4g}", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - lbvd_prod_redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-2}'
          memory: ${REDIS_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://lbvd_app:${MYSQL_PASSWORD}@db:3306/lbvd?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      APP_NAME: "LBVD Dashboard"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_HTTPS_ONLY: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-16}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    expose:
      - "5000"
    volumes:
      - lbvd_prod_app_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-12}'
          memory: ${APP_MEMORY_LIMIT:-20g}

  nginx:
    image: nginx:alpine
    container_name: lbvd-local-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  lbvd_prod_db_data:
  lbvd_prod_redis_data:
  lbvd_prod_app_uploads:
