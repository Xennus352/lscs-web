# Local-only Nginx reverse proxy in front of FastAPI.
# Test the Nginx setup without touching the existing stack:
#
#   docker compose --env-file .env.docker.local \
#     -f docker-compose.local.yml -f docker-compose.nginx.yml up -d
#
# Then open http://localhost:8080  (FastAPI is still on :5000 as well).

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lbvd-local-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
