version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lbvd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: lbvd
      MYSQL_USER: root
      MYSQL_PASSWORD: ''
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:22026
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lbvd-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:@db:3306/lbvd?charset=utf8mb4
      APP_NAME: LBVD Dashboard
      APP_VERSION: 1.0.0
      DEBUG: "true"
      SESSION_SECRET: lbvd-change-this-secret-in-production
      COOKIE_HTTPS_ONLY: "false"
    ports:
      - "5000:5000"
    volumes:
      - .:/app

volumes:
  db_data: