# Nginx front end for the three-VM LBVD deployment.
# Web server 192.168.111.50 -> API server 192.168.111.200:5000
#
# Mounted as /etc/nginx/nginx.conf by docker-compose.web.yml.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    server_tokens       off;
    keepalive_timeout   65;
    keepalive_requests  10000;

    client_header_timeout  20s;
    client_body_timeout    60s;
    send_timeout           60s;
    client_max_body_size   64m;
    client_body_buffer_size 1m;

    types_hash_max_size       4096;
    server_names_hash_bucket_size 64;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml image/svg+xml;

    # Static files (images, JS/CSS, APK downloads) are cached on the web VM so
    # the API server does not re-send the same ~150 MB on every request.
    proxy_cache_path  /var/cache/nginx/lbvd
                      levels=1:2
                      keys_zone=lbvd_static:32m
                      max_size=8g
                      inactive=14d
                      use_temp_path=off;

    upstream lbvd_api {
        server 192.168.111.200:5000  max_fails=3  fail_timeout=10s;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ---------------------------------------------------------------- HTTP ----
    server {
        listen       80 default_server;
        server_name  _;

        # Proxy-only health check, does not touch the API.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Cacheable static content served by FastAPI StaticFiles.
        location ~ ^/(assets|static|apks)/ {
            proxy_pass http://lbvd_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            proxy_cache               lbvd_static;
            proxy_cache_valid         200 206 7d;
            proxy_cache_lock          on;
            proxy_cache_background_update on;
            proxy_cache_use_stale     error timeout updating
                                      http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=86400" always;
            access_log off;
        }

        location / {
            proxy_pass http://lbvd_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # Excel exports on large date ranges can take a while.
            proxy_connect_timeout 10s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;

            proxy_buffering          on;
            proxy_buffer_size        16k;
            proxy_buffers            8 16k;
            proxy_busy_buffers_size  32k;

            proxy_hide_header X-Powered-By;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options        SAMEORIGIN always;
            add_header Referrer-Policy        same-origin always;
        }
    }

    # --------------------------------------------------------------- HTTPS ----
    # Enable after putting the certificate files on the web VM and publishing
    # 443 in docker-compose.web.yml. Also set COOKIE_HTTPS_ONLY=true in .env.api.
    #
    # server {
    #     listen       443 ssl;
    #     http2        on;
    #     server_name  lbvd.example.com;
    #
    #     ssl_certificate      /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key  /etc/nginx/certs/privkey.pem;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     ssl_session_cache    shared:SSL:20m;
    #     ssl_session_timeout  1d;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     # Copy the two location blocks from the HTTP server above.
    #     location / {
    #         proxy_pass http://lbvd_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_set_header X-Forwarded-Host  $host;
    #         proxy_connect_timeout 10s;
    #         proxy_send_timeout    180s;
    #         proxy_read_timeout    180s;
    #     }
    # }
    #
    # Redirect HTTP to HTTPS once TLS works:
    # server {
    #     listen 80;
    #     server_name lbvd.example.com;
    #     return 301 https://$host$request_uri;
    # }
}
